name: diag-scheduler-sigterm

# 진단 전용 브랜치에서만 돈다. main에 넣지 않는다.
on:
  push:
    branches: ["diag/scheduler-sigterm-repro"]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # CI의 test 잡과 같은 방법으로 파이썬을 둔다(같은 인터프리터에서 종료 정리 구간을 본다).
      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # 진짜 supercronic: worker.Dockerfile이 고정한 버전과 체크섬 그대로 받는다.
      - name: Fetch supercronic
        run: |
          set -eux
          ver=$(sed -n 's/^ARG SUPERCRONIC_VERSION=//p' docker/worker.Dockerfile)
          sha=$(sed -n 's/^ARG SUPERCRONIC_SHA256_AMD64=//p' docker/worker.Dockerfile)
          mkdir -p "$RUNNER_TEMP/supercronic-bin"
          curl -fsSLo "$RUNNER_TEMP/supercronic-bin/supercronic" \
            "https://github.com/aptible/supercronic/releases/download/${ver}/supercronic-linux-amd64"
          echo "${sha}  $RUNNER_TEMP/supercronic-bin/supercronic" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/supercronic-bin/supercronic"
          "$RUNNER_TEMP/supercronic-bin/supercronic" -version || true
          echo "REAL_SUPERCRONIC_DIR=$RUNNER_TEMP/supercronic-bin" >> "$GITHUB_ENV"

      - name: Reproduce
        env:
          REPRO_SET: final
        run: .venv/bin/python diag/scheduler_sigterm_repro.py

      - name: Loop the committed test
        run: |
          uv pip install --python .venv/bin/python pytest
          sh diag/loop_committed_test.sh
