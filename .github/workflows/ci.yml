name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # evaluation/requirements.txt의 고정 버전(pandas·lightgbm·numpy·pyarrow 등)을 함께 넣어, 추천 평가 테스트가
      # 리포트를 만든 버전과 같은 버전에서 돈다(고정이 없으면 새 릴리스가 조용히 섞인다).
      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            -r evaluation/requirements.txt \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            kiwipiepy \
            hdbscan \
            rapidfuzz

      # 라우터 테스트(tests/recsys/test_api_today.py 등)는 API 이미지와 같은 백엔드 고정 버전
      # (backend/requirements.txt)에서 돈다. evaluation/requirements.txt는 라벨링 UI용으로
      # fastapi==0.141.1을 고정하므로 위 명령에 fastapi==0.117.1을 같이 넣으면 해석이 실패한다
      # (같은 패키지에 서로 다른 == 고정 두 개). 그래서 두 번째 명령으로 나눠 fastapi만 백엔드 값으로
      # 내린다. 추천 평가 수치에 쓰이는 고정(pandas·lightgbm·numpy·pyarrow 등)은 그대로 남는다.
      - name: Install backend-pinned API test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            "fastapi==0.117.1" \
            httpx \
            "python-jose==3.5.0" \
            "passlib==1.7.4" \
            "bcrypt==3.2.2"

      # sim/ driver tests (fake FastAPI app) and the contract test that runs the
      # driver against the real backend routers. bcrypt is pinned as in
      # backend/requirements.txt: passlib 1.7.4 raises ValueError on bcrypt 5.
      - name: Install API test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            fastapi \
            httpx2 \
            python-jose \
            passlib \
            "bcrypt==3.2.2"

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Run tests (excluding integration)
        run: .venv/bin/python -m pytest -q -m "not integration and not benchmark" tests/

  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: newsletter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            kiwipiepy \
            hdbscan \
            rapidfuzz \
            "fastapi==0.117.1" \
            httpx \
            "python-jose==3.5.0" \
            "passlib==1.7.4" \
            "bcrypt==3.2.2"

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Create pgvector extension
        run: |
          .venv/bin/python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
          conn.close()
          print('vector extension ensured')
          "

      - name: Run alembic upgrade head
        working-directory: backend
        run: ../.venv/bin/python -m alembic upgrade head

      - name: Verify migration downgrade/upgrade round-trip
        working-directory: backend
        run: |
          ../.venv/bin/python -m alembic downgrade -1
          ../.venv/bin/python -m alembic upgrade head

      - name: Run integration tests
        run: .venv/bin/python -m pytest -q -m integration tests/

      - name: Report realtime recsys SQL-path latency (p50/p95)
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_realtime_recsys_seeded_db.py -k "latency or click_moves"

  # Dockerfile이 깨지지 않게 linux/amd64로 이미지를 빌드만 한다(푸시 없음). 배포 대상(Oracle A1)은
  # arm64지만 GitHub 호스티드 러너에서 arm64 에뮬레이션 빌드는 느려서 amd64로 문법/의존성만 검증하고,
  # arm64 빌드는 로컬 colima(Apple Silicon)에서 확인한다(docs/adr/0006).
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        if: matrix.image == 'api'
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_SECRET_KEY: ci-only-not-a-secret
        run: |
          docker compose config -q
          docker compose --profile tools config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          # API 이미지만 러너의 docker로 불러와 아래 스모크에서 실행한다(worker는 torch 때문에 크다).
          load: ${{ matrix.image == 'api' }}
          tags: newsletter-recsys/${{ matrix.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 빌드 성공만으로는 "이미지에 복사하지 않은 모듈을 임포트한다"를 잡지 못한다(컨테이너가 뜰 때
      # ModuleNotFoundError). 이미지 안에서 앱을 임포트하고 lifespan(추천 서비스 조립)까지 돌려 본다.
      # 엔진은 접속을 미루므로 DB 없이 된다.
      - name: Smoke-test API image (import app + run lifespan, no DB)
        if: matrix.image == 'api'
        run: |
          docker run --rm -i \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            -e SECRET_KEY=ci-only-not-a-secret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            newsletter-recsys/api:ci python - <<'PY'
          import asyncio

          from app.main import app


          async def boot():
              async with app.router.lifespan_context(app):
                  print("api image: app imported and lifespan ran")


          asyncio.run(boot())
          PY
