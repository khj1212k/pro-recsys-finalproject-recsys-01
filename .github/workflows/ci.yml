name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            kiwipiepy \
            hdbscan \
            rapidfuzz

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Run tests (excluding integration)
        run: .venv/bin/python -m pytest -q -m "not integration and not benchmark" tests/

  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: newsletter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            kiwipiepy \
            hdbscan \
            rapidfuzz

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Create pgvector extension
        run: |
          .venv/bin/python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
          conn.close()
          print('vector extension ensured')
          "

      - name: Run alembic upgrade head
        working-directory: backend
        run: ../.venv/bin/python -m alembic upgrade head

      - name: Verify migration downgrade/upgrade round-trip
        working-directory: backend
        run: |
          ../.venv/bin/python -m alembic downgrade -1
          ../.venv/bin/python -m alembic upgrade head

      - name: Run integration tests
        run: .venv/bin/python -m pytest -q -m integration tests/

  # Dockerfile이 깨지지 않게 linux/amd64로 이미지를 빌드만 한다(푸시 없음). 배포 대상(Oracle A1)은
  # arm64지만 GitHub 호스티드 러너에서 arm64 에뮬레이션 빌드는 느려서 amd64로 문법/의존성만 검증하고,
  # arm64 빌드는 로컬 colima(Apple Silicon)에서 확인한다(docs/adr/0006).
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, airflow]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        if: matrix.image == 'api'
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_SECRET_KEY: ci-only-not-a-secret
        run: |
          docker compose config -q
          docker compose --profile tools --profile airflow config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
