name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # evaluation/requirements.txt의 고정 버전(pandas·lightgbm·numpy·pyarrow 등)을 함께 넣어, 추천 평가 테스트가
      # 리포트를 만든 버전과 같은 버전에서 돈다(고정이 없으면 새 릴리스가 조용히 섞인다).
      # kiwipiepy is pinned in this job: the simulator's click-model calibration and feature
      # tests depend on its tokenization (same version as sim/requirements.txt).
      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            -r evaluation/requirements.txt \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            "kiwipiepy==0.23.2" \
            hdbscan \
            rapidfuzz

      # 라우터 테스트(tests/recsys/test_api_today.py 등)는 API 이미지와 같은 백엔드 고정 버전
      # (backend/requirements.txt)에서 돈다. evaluation/requirements.txt는 라벨링 UI용으로
      # fastapi==0.141.1을 고정하므로 위 명령에 fastapi==0.117.1을 같이 넣으면 해석이 실패한다
      # (같은 패키지에 서로 다른 == 고정 두 개). 그래서 두 번째 명령으로 나눠 fastapi만 백엔드 값으로
      # 내린다. 추천 평가 수치에 쓰이는 고정(pandas·lightgbm·numpy·pyarrow 등)은 그대로 남는다.
      - name: Install backend-pinned API test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            "fastapi==0.117.1" \
            httpx \
            "python-jose==3.5.0" \
            "passlib==1.7.4" \
            "bcrypt==3.2.2"

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      # sim/: the contract test runs the driver against the real backend routers. Its API and auth
      # dependencies (fastapi, httpx, python-jose, passlib, and bcrypt pinned because passlib 1.7.4
      # raises ValueError on bcrypt 5) are installed by the backend-pinned step above. This step
      # adds what the headless Locust smoke test needs: locust + uvicorn (uvicorn is already
      # pinned through evaluation/requirements.txt, so only locust is new here).
      - name: Install simulator test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            locust \
            uvicorn

      - name: Run tests (excluding integration)
        run: .venv/bin/python -m pytest -q -m "not integration and not benchmark" tests/

  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: newsletter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            pytest \
            langgraph \
            langchain-openai \
            openai \
            tiktoken \
            numpy \
            pandas \
            scikit-learn \
            lightgbm \
            optuna \
            pgvector \
            psycopg2-binary \
            python-dotenv \
            sqlalchemy \
            sqlmodel \
            alembic \
            feedparser \
            requests \
            python-dateutil \
            trafilatura \
            tqdm \
            pyyaml \
            lxml_html_clean \
            pydantic \
            kiwipiepy \
            hdbscan \
            rapidfuzz \
            "fastapi==0.117.1" \
            httpx \
            "python-jose==3.5.0" \
            "passlib==1.7.4" \
            "bcrypt==3.2.2"

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Create pgvector extension
        run: |
          .venv/bin/python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
          conn.close()
          print('vector extension ensured')
          "

      - name: Run alembic upgrade head
        working-directory: backend
        run: ../.venv/bin/python -m alembic upgrade head

      - name: Verify migration downgrade/upgrade round-trip
        working-directory: backend
        run: |
          ../.venv/bin/python -m alembic downgrade -1
          ../.venv/bin/python -m alembic upgrade head

      # tests/integration/test_merge_tier0_news_raw_sql.py는 런북과 같은 경로(psql -1 -f ... < CSV)로
      # scripts/oci/merge_tier0_news_raw.sql을 돌린다. psql이 없으면 그 테스트는 건너뛰므로, 건너뛴 채
      # 초록이 되지 않게 여기서 있는지 확인하고 없으면 설치한다.
      - name: Ensure psql client
        run: |
          command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client)
          psql --version

      - name: Run integration tests
        run: .venv/bin/python -m pytest -q -m integration tests/

      - name: Report realtime recsys SQL-path latency (p50/p95)
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_realtime_recsys_seeded_db.py -k "latency or click_moves"

      # train/serve parity 게이트(docs/adr/0033). 위 integration 실행에서 이미 한 번 돈 테스트를, 리포트 경로를 주고
      # 다시 돌려 JSON을 남긴다. reports/recsys/parity_v1.json은 이 아티팩트(recsys-parity)를 옮겨 적은 것이다.
      - name: Write parity gate report
        env:
          RECSYS_PARITY_REPORT: parity_v1.json
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_feature_parity.py

      - name: Upload parity gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recsys-parity
          path: parity_v1.json
          if-no-files-found: warn

  # Dockerfile이 깨지지 않게 linux/amd64로 이미지를 빌드만 한다(푸시 없음). 배포 대상(Oracle A1)은
  # arm64지만 GitHub 호스티드 러너에서 arm64 에뮬레이션 빌드는 느려서 amd64로 문법/의존성만 검증하고,
  # arm64 빌드는 로컬 colima(Apple Silicon)에서 확인한다(docs/adr/0006).
  # ingest는 Tier 0(OCI E2.1.Micro, amd64)의 수집 전용 이미지다(docs/adr/0026).
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, ingest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        if: matrix.image == 'api'
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_SECRET_KEY: ci-only-not-a-secret
        run: |
          docker compose config -q
          docker compose --profile tools config -q
          # Tier 0 오버레이(docs/runbook-hosting.md 4절의 COMPOSE_FILE과 같은 조합)
          docker compose -f docker-compose.yml -f docker/compose.micro.yaml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          # api·ingest 이미지만 러너의 docker로 불러와 아래 스모크에서 실행한다(worker는 torch 때문에 크다).
          load: ${{ matrix.image != 'worker' }}
          tags: newsletter-recsys/${{ matrix.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 빌드 성공만으로는 "이미지에 복사하지 않은 모듈을 임포트한다"를 잡지 못한다(컨테이너가 뜰 때
      # ModuleNotFoundError). 이미지 안에서 앱을 임포트하고 lifespan(추천 서비스 조립)까지 돌려 본다.
      # 엔진은 접속을 미루므로 DB 없이 된다.
      - name: Smoke-test API image (import app + run lifespan, no DB)
        if: matrix.image == 'api'
        run: |
          docker run --rm -i \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            -e SECRET_KEY=ci-only-not-a-secret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            newsletter-recsys/api:ci python - <<'PY'
          import asyncio

          # 랭커를 채점하는 경로(ADR 0033)는 모델이 등록된 뒤에야 임포트된다: 이미지에 lightgbm과 그
          # OpenMP 런타임, 피처 어댑터가 실제로 있는지 여기서 미리 확인한다.
          import lightgbm
          from app.recsys.config import RecsysConfig
          from app.recsys.lgbm_scorer import resolve_feature_fn

          assert resolve_feature_fn(RecsysConfig().feature_fn) is not None, "serving feature adapter not importable"
          print(f"api image: lightgbm {lightgbm.__version__} and the serving feature adapter import")

          from app.main import app


          async def boot():
              async with app.router.lifespan_context(app):
                  print("api image: app imported and lifespan ran")


          asyncio.run(boot())
          PY

      # 수집 전용 이미지는 worker 이미지에서 torch·hdbscan·lightgbm·LLM SDK를 뺀 것이라, Tier 0가 도는 잡
      # (migrate, ingest --stages rss,extract, popularity, daily_report)이 임포트하는 모듈에 그런 의존성이
      # 새로 끼어들면 VM에서 잡이 뜰 때에야 ImportError가 난다. 잡 함수가 실행 시점에 임포트하는
      # 모듈까지 이미지 안에서 임포트해 본다. DB 접속은 하지 않는다.
      - name: Smoke-test ingest image (import Tier 0 job modules, no DB)
        if: matrix.image == 'ingest'
        run: |
          docker run --rm -i --entrypoint python \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            newsletter-recsys/ingest:ci - <<'PY'
          import importlib

          MODULES = (
              "jobs.run", "jobs.migrate", "jobs.notify",
              "jobs.tasks.ingest", "jobs.tasks.popularity", "jobs.tasks.daily_report",
              "db.connection", "db.schema", "config.settings", "config.sources",
              "crawler.rss_collector", "crawler.content_extractor", "crawler.policy_briefing",
              "scheduler.calculate_ranking", "app.models",
              "alembic.command", "alembic.config",
          )
          for name in MODULES:
              importlib.import_module(name)
          print(f"ingest image: {len(MODULES)} Tier 0 job modules imported")
          PY
