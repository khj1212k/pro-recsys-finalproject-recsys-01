name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 코드가 돌지 못하거나 항상 틀리게 도는 오류만 본다(구문 오류, 정의 안 된 이름, 잘못된 포맷 문자열 등). 규칙과 이유는
  # pyproject.toml에 있고, 스타일 규칙은 일부러 켜지 않았다. 로컬에서는 `make lint`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: ruff check
        run: uvx --from "ruff==0.16.9" ruff check --output-format=github .

  # 이 push·PR이 새로 들이는 커밋만 비밀 값을 검사한다. git 이력에는 평문 DB 비밀번호 유출 전력이 있지만
  # (tests/test_no_plaintext_db_password_in_env_example.py) 이력은 다시 쓰지 않으므로 옛 커밋은 보지 않는다.
  # 바이너리는 릴리스 체크섬으로 고정해 내려받는다. 설정: .gitleaks.toml
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the commits this push or pull request adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..HEAD"
          else
            # 새 브랜치이거나 강제 푸시로 이전 커밋이 없다: main에 없는 커밋만 본다.
            RANGE="origin/main..HEAD"
          fi
          echo "scanning commits in ${RANGE} ($(git rev-list --count "${RANGE}") commits)"
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="${RANGE}" .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # 파이썬 패키지 버전은 잠금 파일 하나(requirements-ci.txt)가 정한다. 최상위 목록은 requirements-ci.in이고
      # 갱신은 `make ci-lock`이다. 추천 평가 리포트를 만든 버전(evaluation/requirements.txt)과 API 이미지 버전
      # (backend/requirements.txt: fastapi·sqlalchemy·sqlmodel 등)을 그 안에서 함께 고정하며, 원본과의 일치는
      # tests/test_ci_requirements_lock.py가 대조한다(docs/adr/0006 개정 2026-10-18).
      - name: Install locked test dependencies
        run: uv pip install --python .venv/bin/python -r requirements-ci.txt

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Run tests (excluding integration)
        run: .venv/bin/python -m pytest -q -m "not integration and not benchmark" tests/

  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsletter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsletter_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: newsletter_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Create virtualenv
        run: uv venv --python 3.11 .venv

      # 단위 테스트 잡과 같은 잠금 파일(requirements-ci.txt)을 쓴다.
      - name: Install locked test dependencies
        run: uv pip install --python .venv/bin/python -r requirements-ci.txt

      - name: Install ai_workspace package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace

      - name: Install recommend_engine package (no deps, editable)
        run: uv pip install --python .venv/bin/python --no-deps -e ai_workspace/recommend_engine

      - name: Create pgvector extension
        run: |
          .venv/bin/python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
          conn.close()
          print('vector extension ensured')
          "

      - name: Run alembic upgrade head
        working-directory: backend
        run: ../.venv/bin/python -m alembic upgrade head

      - name: Verify migration downgrade/upgrade round-trip
        working-directory: backend
        run: |
          ../.venv/bin/python -m alembic downgrade -1
          ../.venv/bin/python -m alembic upgrade head

      # tests/integration/test_merge_tier0_news_raw_sql.py는 런북과 같은 경로(psql -1 -f ... < CSV)로
      # scripts/oci/merge_tier0_news_raw.sql을 돌린다. test_tier0_backup_restore.py는 pg_dump·pg_restore로
      # 호스트 밖 백업을 만들고 복원한다(ADR 0026 결정 6). 도구가 없으면 그 테스트들은 건너뛰므로, 건너뛴 채
      # 초록이 되지 않게 여기서 있는지 확인하고 없으면 설치한다. pg_dump는 서버(16)보다 낮은 메이저면 덤프를 거절한다.
      - name: Ensure PostgreSQL client tools
        run: |
          (command -v psql && command -v pg_dump && command -v pg_restore) || \
            (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client)
          psql --version
          pg_dump --version
          pg_restore --version
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -ge 16

      - name: Run integration tests
        run: .venv/bin/python -m pytest -q -m integration tests/

      - name: Report realtime recsys SQL-path latency (p50/p95)
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_realtime_recsys_seeded_db.py -k "latency or click_moves"

      # train/serve parity 게이트(docs/adr/0033). 위 integration 실행에서 이미 한 번 돈 테스트를, 리포트 경로를 주고
      # 다시 돌려 JSON을 남긴다. reports/recsys/parity_v1.json은 이 아티팩트(recsys-parity)를 옮겨 적은 것이다.
      - name: Write parity gate report
        env:
          RECSYS_PARITY_REPORT: parity_v1.json
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_feature_parity.py

      - name: Upload parity gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recsys-parity
          path: parity_v1.json
          if-no-files-found: warn

      # 본문 보존(docs/adr/0023 개정 2026-10-17): Tier 0 규모(30,000행) 합성 news_raw에서 마이그레이션 f1db3221e45f의
      # 길이 채우기와 retention 잡의 시간·WAL·크기·동시 쓰기 지연을 잰다. RETENTION_REPORT가 있을 때만 도는 테스트다.
      - name: Write retention measurement report
        env:
          RETENTION_REPORT: retention_v1.json
        run: .venv/bin/python -m pytest -q -s -m integration tests/integration/test_retention_volume.py

      - name: Upload retention measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-measurement
          path: retention_v1.json
          if-no-files-found: warn

  # Dockerfile이 깨지지 않게 linux/amd64로 이미지를 빌드만 한다(푸시 없음). 배포 대상(Oracle A1)은
  # arm64지만 GitHub 호스티드 러너에서 arm64 에뮬레이션 빌드는 느려서 amd64로 문법/의존성만 검증하고,
  # arm64 빌드는 로컬 colima(Apple Silicon)에서 확인한다(docs/adr/0006).
  # ingest는 Tier 0(OCI E2.1.Micro, amd64)의 수집 전용 이미지다(docs/adr/0026).
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, ingest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        if: matrix.image == 'api'
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          API_SECRET_KEY: ci-only-not-a-secret
        run: |
          docker compose config -q
          docker compose --profile tools config -q
          # Tier 0 오버레이(docs/runbook-hosting.md 4절의 COMPOSE_FILE과 같은 조합)
          docker compose -f docker-compose.yml -f docker/compose.micro.yaml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          # api·ingest 이미지만 러너의 docker로 불러와 아래 스모크에서 실행한다(worker는 torch 때문에 크다).
          load: ${{ matrix.image != 'worker' }}
          tags: newsletter-recsys/${{ matrix.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 빌드 성공만으로는 "이미지에 복사하지 않은 모듈을 임포트한다"를 잡지 못한다(컨테이너가 뜰 때
      # ModuleNotFoundError). 이미지 안에서 앱을 임포트하고 lifespan(추천 서비스 조립)까지 돌려 본다.
      # 엔진은 접속을 미루므로 DB 없이 된다.
      - name: Smoke-test API image (import app + run lifespan, no DB)
        if: matrix.image == 'api'
        run: |
          docker run --rm -i \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            -e SECRET_KEY=ci-only-not-a-secret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            newsletter-recsys/api:ci python - <<'PY'
          import asyncio

          # 랭커를 채점하는 경로(ADR 0033)는 모델이 등록된 뒤에야 임포트된다: 이미지에 lightgbm과 그
          # OpenMP 런타임, 피처 어댑터가 실제로 있는지 여기서 미리 확인한다.
          import lightgbm
          from app.recsys.config import RecsysConfig
          from app.recsys.lgbm_scorer import resolve_feature_fn

          assert resolve_feature_fn(RecsysConfig().feature_fn) is not None, "serving feature adapter not importable"
          print(f"api image: lightgbm {lightgbm.__version__} and the serving feature adapter import")

          from app.main import app


          async def boot():
              async with app.router.lifespan_context(app):
                  print("api image: app imported and lifespan ran")


          asyncio.run(boot())
          PY

      # 수집 전용 이미지는 worker 이미지에서 torch·hdbscan·lightgbm·LLM SDK를 뺀 것이라, Tier 0가 도는 잡
      # (migrate, ingest --stages rss,extract, popularity, daily_report, retention)이 임포트하는 모듈에 그런 의존성이
      # 새로 끼어들면 VM에서 잡이 뜰 때에야 ImportError가 난다. 잡 함수가 실행 시점에 임포트하는
      # 모듈까지 이미지 안에서 임포트해 본다. DB 접속은 하지 않는다.
      - name: Smoke-test ingest image (import Tier 0 job modules, no DB)
        if: matrix.image == 'ingest'
        run: |
          docker run --rm -i --entrypoint python \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            newsletter-recsys/ingest:ci - <<'PY'
          import importlib

          MODULES = (
              "jobs.run", "jobs.migrate", "jobs.notify",
              "jobs.tasks.ingest", "jobs.tasks.popularity", "jobs.tasks.daily_report", "jobs.tasks.retention",
              "db.connection", "db.schema", "config.settings", "config.sources", "config.retention",
              "crawler.rss_collector", "crawler.content_extractor", "crawler.policy_briefing",
              "scheduler.calculate_ranking", "app.models",
              "alembic.command", "alembic.config",
          )
          for name in MODULES:
              importlib.import_module(name)
          print(f"ingest image: {len(MODULES)} Tier 0 job modules imported")
          PY
