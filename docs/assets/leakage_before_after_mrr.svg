<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">같은 모델, 추론 시점만 다르다: 누출을 걷어내면 MRR이 내려간다</text>
<text x="24.0" y="50.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">[team-synth] 팀이 남긴 LLM 합성 클릭, 평가 유저 31명. 절대값은 성능이 아니라 진단이다.</text>
