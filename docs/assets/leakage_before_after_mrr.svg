<title id="t">같은 모델을 point-in-time과 팀 방식 추론 시점으로 평가한 MRR</title>
<desc id="d">코드 버전 세 개 모두 팀 방식 추론 시점(as-written)의 MRR이 point-in-time보다 높고, 쌍 차이의 95% 신뢰구간이 0을 제외한다.</desc>
