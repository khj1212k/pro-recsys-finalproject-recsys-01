<title id="t">EB-NeRD ablation 사슬의 단계별 nDCG@10 변화: 노출 재정렬과 전체 풀 랭킹</title>
<desc id="d">노출 비클릭 네거티브로 바꾸는 단계는 노출 재정렬(P1)에서 +0.1868, 전체 풀 랭킹(P2)에서 −0.1307이다. 모델 교체(binary에서 LambdaRank)는 두 과제 모두 0에 가깝다.</desc>
<rect x="0.5" y="0.5" width="799" height="559" rx="8" fill="#fcfcfb" stroke="#d9d8d4"/>
<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">네거티브 분포가 과제를 정한다: 같은 단계, 반대 부호</text>
<text x="24.0" y="50.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">[EB-NeRD] ebnerd_small, 단계별 nDCG@10 변화(같은 요청의 쌍체 차이). 이 서비스의 성능이 아니다.</text>
