<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
<title id="t">E15 판정: 신경망 arm과 스태킹 arm의 nDCG@10 차이(튜닝한 LightGBM A* 대비)</title>
<desc id="d">네 비교 모두 차이의 95% 신뢰구간이 0 아래이고 사전 등록한 seed 규칙을 통과하지 못했다(seed_rule_failed).</desc>
<rect x="0.5" y="0.5" width="799" height="339" rx="8" fill="#fcfcfb" stroke="#d9d8d4"/>
<text x="24.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">NRMS-lite는 튜닝한 LightGBM을 넘지 못했다 (E15, 사전 등록 판정)</text>
<text x="24.0" y="50.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">[EB-NeRD] 같은 노출의 쌍체 차이 ΔnDCG@10 = arm − A*(튜닝한 LightGBM), 95% CI. 한국어 서비스의 성능이 아니다.</text>
