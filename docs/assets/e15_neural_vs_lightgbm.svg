<text x="24.0" y="296.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">수염이 점 가까이에 붙는 것은 표본이 큰 탓이다(P1 24.5만 노출). 0을 넘지 못했다는 사실 하나만 읽는다.</text>
<text x="24.0" y="312.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">신경망 family당 12 trial, A* 24 trial, seed 3개. 범위: NRMS-lite(고정 BGE-M3 투영) 한정. 'GBDT가 신경망보다 낫다'로 일반화하지 않는다.</text>
<text x="24.0" y="328.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">출처: reports/recsys/ebnerd_v1_3_neural.json (verdict.by_task). 증거 등급 preregistered-run.</text>
