# LLM 토큰 단가표 (USD, 1M 토큰당). bake-off 비용 계산(ADR 0009)과 배치 비용
# 추정에 쓴다. 모든 항목은 공식 가격 페이지 URL과 접근일을 남겨야 한다
# (core/llm/pricing.py가 누락 시 로드를 거부한다). 가격이 바뀌면 기존 항목에
# until을 달고 from이 있는 새 항목을 추가한다 - 과거 실행의 비용을 재계산할 수 있게.
# 세금(VAT 등)은 포함하지 않는다. 캐시 입력 단가는 이 파이프라인이 프롬프트
# 캐싱을 쓰지 않아 기록하지 않는다.
currency: USD

models:
  gemini-3.5-flash-lite:
    provider: gemini
    prices:
      - input_per_1m: 0.30
        output_per_1m: 2.50
        source: https://ai.google.dev/gemini-api/docs/pricing
        accessed: "2026-09-25"
        note: "Paid tier standard, text input. 문서 'Last updated 2026-09-24 UTC'"
