[project]
name = "recommend-engine"
version = "0.3.0"
description = "Personalized News Recommendation System with Two-Tower Model"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "FlagEmbedding==1.2.5",

    "transformers>=4.40.0",
    "torch>=2.0.0",
    "lightgbm",
    
    "pyyaml",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "pgvector>=0.4.2",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

##
[tool.hatch.build.targets.wheel]
packages = ["src"]
##

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
