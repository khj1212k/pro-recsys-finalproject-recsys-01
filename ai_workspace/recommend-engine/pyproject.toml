[project]
name = "recommend-engine"
version = "0.2.2"  # 버전을 살짝 올렸습니다
description = "Personalized News Recommendation System with BGE-M3"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "FlagEmbedding>=1.3.0",  # FlagEmbedding도 최신 안정 버전 권장
    "transformers>=4.37.0,<4.49.0",  # [핵심 수정] 오류 원인인 최신 버전 방지 (4.49 미만으로 고정)
    "torch>=2.6.0",
    "pyyaml"
]

# PyTorch 2.6 호환을 위해 CUDA 12.4 버전 인덱스 사용
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }