[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-ai-pipeline"
version = "0.1.0"
description = "뉴스 크롤링 -> 임베딩 -> 클러스터링 -> LLM 뉴스레터 생성 파이프라인 (AI Workspace)"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-openai",
    "openai",
    "tiktoken",
    "numpy",
    "pandas",
    "scikit-learn>=1.3.0",
    "hdbscan",
    "kiwipiepy",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "pgvector>=0.4.2",
    "feedparser",
    "requests",
    "python-dateutil",
    "trafilatura",
    "tqdm>=4.65.0",
    "pyyaml",
    "lxml_html_clean",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
# BGE-M3 임베딩 모델 실행에 필요한 무거운 의존성(torch 포함 수 GB). 테스트는
# tests/recommend_engine/conftest.py 등에서 torch를 stub으로 대체하므로 기본
# 의존성에는 포함하지 않는다 - 실제로 임베딩을 돌릴 때만 `pip install -e ".[embed]"`.
embed = [
    "torch>=2.0.0",
    "FlagEmbedding==1.2.5",
    "transformers==4.38.2",
    "sentence-transformers==2.2.2",
]

# 이 프로젝트는 'ai_workspace를 루트로' from core.xxx / from crawler.xxx 형태의
# 절대 임포트를 그대로 씁니다 (ai_workspace.core.xxx 가 아님). 기존 sys.path.insert()
# 방식과 동일한 임포트 경로를 pip install -e . 로도 그대로 쓸 수 있도록
# 패키지 프리픽스 없이 core/crawler/db/... 를 최상위 패키지로 등록합니다.
# recommend_engine은 자체 pyproject.toml을 가진 별도의 설치 단위입니다
# (recommend_engine/README.md 참고) - 여기서는 제외합니다.
[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "crawler*", "db*", "pipeline*", "utils*", "workflow*"]
exclude = ["recommend_engine*", "*.__pycache__*"]
